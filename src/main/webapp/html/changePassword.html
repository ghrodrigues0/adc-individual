<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Mudar Password</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <h2>Mudar Password</h2>
    <div class="row">
      <input type="text" id="username" placeholder="Email" required />
      <input
        type="password"
        id="oldPassword"
        placeholder="Password Antiga"
        required
      />
      <input
        type="password"
        id="newPassword"
        placeholder="Nova Password"
        required
      />
      <input type="button" id="btn-pwd" value="Alterar Password" />
    </div>
    <hr />
    <main id="OpResult"></main>
    <script src="../js/changePassword.js"></script>
    <hr />
    <p><a href="../index.html">Voltar</a></p>
  </body>
</html>
